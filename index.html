const COLOR = {"工装裤": "#8d6e63", "休闲裤": "#1976d2", "运动裤": "#43a047", "户外长裤": "#5e35b1"};
const container = document.getElementById('container');
const nav = document.getElementById('nav');
const list = [];
let globalStart = 0;

DATA.forEach((g, gi) => {
  const c = COLOR[g.name] || '#f53c00';
  const sec = document.createElement('section');
  sec.id = 'sec' + gi;
  sec.style.setProperty('--c', c);
  sec.innerHTML = '<div class="sec-title"><span class="dot"></span><h2>' + g.name + '</h2><span class="num">' + g.count + ' 款</span></div>';
  const grid = document.createElement('div');
  grid.className = 'grid';
  g.items.forEach((item, i) => {
    const gi2 = globalStart + i;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.gi = gi2;
    card.innerHTML = '<img loading="lazy" src="' + item.url + '" alt="">' +
      '<div class="info"><div class="idx"><span class="idxnum">#' + (gi2 + 1) + '</span><span class="tag" style="color:' + c + '">' + g.name + '</span></div>' +
      '<div class="note">' + (item.note || '') + '</div></div>';
    grid.appendChild(card);
    list.push({url: item.url, name: g.name, note: item.note || ''});
  });
  sec.appendChild(grid);
  container.appendChild(sec);
  nav.innerHTML += '<a href="#sec' + gi + '" style="--nc:' + c + '">' + g.name + ' <span style="opacity:.7">(' + g.count + ')</span></a>';
  globalStart += g.count;
});

document.querySelectorAll('.nav a').forEach(a => {
  const nc = a.style.getPropertyValue('--nc');
  a.addEventListener('mouseenter', () => { a.style.background = nc; });
  a.addEventListener('mouseleave', () => { a.style.background = '#f0f1f3'; });
});

const lb = document.getElementById('lightbox');
const lbimg = document.getElementById('lbimg');
const lbcap = document.getElementById('lbcaption');
let cur = 0;
function show(n){
  cur = n;
  const item = list[n];
  lbimg.src = item.url;
  lbcap.textContent = item.name + ' · ' + item.note + ' · ' + (n + 1) + ' / ' + list.length;
  lb.classList.add('show');
}
function hide(){ lb.classList.remove('show'); }
function move(d){
  show((cur + d + list.length) % list.length);
}
container.querySelectorAll('.card').forEach(c => {
  c.addEventListener('click', () => show(parseInt(c.dataset.gi)));
});
document.getElementById('lbclose').addEventListener('click', hide);
document.getElementById('lbprev').addEventListener('click', () => move(-1));
document.getElementById('lbnext').addEventListener('click', () => move(1));
lb.addEventListener('click', (e) => { if(e.target === lb) hide(); });
document.addEventListener('keydown', (e) => {
  if(!lb.classList.contains('show')) return;
  if(e.key === 'Escape') hide();
  else if(e.key === 'ArrowLeft') move(-1);
  else if(e.key === 'ArrowRight') move(1);
});
</script>
