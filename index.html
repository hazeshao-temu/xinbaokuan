<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9月新爆款 · 主图集合页（按叶子类目）</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --sub:#6b7280; --line:#e6e8ec;
    --brand:#E8542F; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  /* ---------- header ---------- */
  .hero{background:radial-gradient(1200px 400px at 15% -20%,#ffd9c9 0,transparent 60%),linear-gradient(135deg,#1c1f24,#2b3138);color:#fff;padding:30px 24px 22px}
  .hero .wrap{max-width:1440px;margin:0 auto}
  .hero h1{margin:0 0 8px;font-size:24px;letter-spacing:.5px}
  .hero p{margin:0;color:#c9ced6;font-size:13.5px;line-height:1.7}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;font-size:12.5px;color:#e9edf2}
  .stat b{font-size:17px;color:#fff;margin-right:5px;font-weight:700}
  /* ---------- sticky nav ---------- */
  .navbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line);padding:10px 0}
  .navbar .inner{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;gap:14px;align-items:center}
  .search{flex:0 0 240px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;background:#fbfcfe}
  .search input:focus{border-color:#c7ccd4;background:#fff}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;flex:1;scrollbar-width:thin}
  .chips::-webkit-scrollbar{height:6px}
  .chips::-webkit-scrollbar-thumb{background:#d3d7de;border-radius:6px}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);
    border-radius:999px;background:#fff;font-size:12.5px;color:#3a3f47;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip:hover{border-color:#c7ccd4;background:#fafbfc}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .chip .cnt{color:#98a0aa;font-size:11.5px}
  /* ---------- sections ---------- */
  main{max-width:1440px;margin:0 auto;padding:22px 24px 80px}
  .sec{margin-top:30px;scroll-margin-top:78px}
  .sec-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px 12px 0 0;color:#fff}
  .sec-head .bar{width:4px;height:22px;border-radius:3px;background:rgba(255,255,255,.85)}
  .sec-head h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.3px}
  .sec-head .n{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px}
  .grid{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;
    padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;transition:.16s;position:relative}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#d8dce2}
  .thumb{position:relative;aspect-ratio:3/4;background:#f1f3f6;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
  .card:hover .thumb img{transform:scale(1.04)}
  .badge{position:absolute;left:8px;top:8px;background:rgba(17,20,24,.72);color:#fff;font-size:11px;
    padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.4px;backdrop-filter:blur(4px)}
  .cattag{position:absolute;right:8px;top:8px;color:#fff;font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:600;
    max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{padding:9px 10px 11px}
  .meta .t{font-size:12.5px;line-height:1.45;color:#2a2f36;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:54px;word-break:break-word}
  .meta .row{display:flex;align-items:center;margin-top:8px;font-size:11px;color:var(--sub);gap:6px}
  .meta .spu{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f5f8;border-radius:5px;padding:1.5px 6px;color:#5a6270}
  .ph{display:flex;align-items:center;justify-content:center;height:100%;color:#aab1bb;font-size:11.5px;padding:14px;text-align:center}
  .empty{text-align:center;color:var(--sub);padding:60px 0;font-size:13.5px;display:none}
  /* ---------- lightbox ---------- */
  #lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(12,14,17,.9);align-items:center;justify-content:center;padding:34px}
  #lb.on{display:flex}
  #lb .stage{max-width:min(1000px,92vw);max-height:88vh;display:flex;flex-direction:column;gap:12px}
  #lb img{max-width:100%;max-height:74vh;object-fit:contain;border-radius:10px;background:#fff;align-self:center}
  #lb .cap{color:#e8ebf0;font-size:13px;line-height:1.65;text-align:center}
  #lb .cap .k{color:#9aa3b0;font-size:11.5px}
  .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;
    background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .navbtn:hover{background:rgba(255,255,255,.26)}
  #prev{left:22px} #next{right:22px}
  .close{position:absolute;top:20px;right:24px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
    color:#fff;font-size:20px;cursor:pointer}
  .close:hover{background:rgba(255,255,255,.26)}
  #cnt{position:absolute;top:26px;left:50%;transform:translateX(-50%);color:#cfd5dd;font-size:12.5px}
  footer{max-width:1440px;margin:0 auto;padding:0 24px 40px;color:#98a0aa;font-size:12px;text-align:center}
  @media(max-width:720px){
    .navbar .inner{flex-wrap:wrap}
    .search{flex:1 1 100%}
    main{padding:16px 12px 60px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
    .hero{padding:22px 16px 18px}
    .navbtn{width:40px;height:40px} #prev{left:8px} #next{right:8px}
  }
</style>
</head>

var ITEMS = DATA.items, CATS = DATA.cats;
var byKey = {};
CATS.forEach(function(c){ byKey[c.n] = c; });

/* header stats */
document.getElementById('hCount').textContent = ITEMS.length;
document.getElementById('hCat').textContent = CATS.length;
document.getElementById('s1').textContent = ITEMS.length;
document.getElementById('s2').textContent = CATS.length;

/* nav chips */
var chips = document.getElementById('chips');
CATS.forEach(function(c){
  var el = document.createElement('div');
  el.className = 'chip';
  el.setAttribute('data-target', c.k);
  var dot = document.createElement('span'); dot.className='dot'; dot.style.background=c.color;
  var nm = document.createElement('span'); nm.textContent = c.n;
  var ct = document.createElement('span'); ct.className='cnt'; ct.textContent = c.count;
  el.appendChild(dot); el.appendChild(nm); el.appendChild(ct);
  el.addEventListener('click', function(){
    var t = document.getElementById(c.k);
    if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
  });
  chips.appendChild(el);
});

/* sections + cards */
var main = document.getElementById('main');
CATS.forEach(function(c){
  var sec = document.createElement('section');
  sec.className = 'sec'; sec.id = c.k;
  var head = document.createElement('div');
  head.className = 'sec-head'; head.style.background = c.color;
  var bar = document.createElement('span'); bar.className='bar';
  var h2 = document.createElement('h2'); h2.textContent = c.n;
  var n = document.createElement('span'); n.className='n'; n.textContent = c.count + ' 款';
  head.appendChild(bar); head.appendChild(h2); head.appendChild(n);
  var grid = document.createElement('div'); grid.className='grid';
  var list = ITEMS.filter(function(it){ return it.c === c.n; });
  list.forEach(function(it){
    var card = document.createElement('div');
    card.className = 'card'; card.setAttribute('data-i', it.i - 1);
    card.setAttribute('data-k', (it.en + ' ' + it.t + ' ' + it.s).toLowerCase());
    var th = document.createElement('div'); th.className='thumb';
    var img = document.createElement('img');
    img.loading = 'lazy'; img.alt = it.en; img.src = it.img;
    img.addEventListener('error', function(){
      var d = document.createElement('div'); d.className='ph'; d.textContent = it.en.slice(0, 70);
      th.innerHTML = ''; th.appendChild(d);
    });
    var bd = document.createElement('span'); bd.className='badge'; bd.textContent = '#' + it.i;
    var tg = document.createElement('span'); tg.className='cattag'; tg.style.background = c.color; tg.textContent = c.n;
    th.appendChild(img); th.appendChild(bd); th.appendChild(tg);
    var meta = document.createElement('div'); meta.className='meta';
    var tt = document.createElement('div'); tt.className='t'; tt.textContent = it.en; tt.title = it.en;
    var row = document.createElement('div'); row.className='row';
    var spu = document.createElement('span'); spu.className='spu'; spu.textContent = it.s;
    row.appendChild(spu);
    meta.appendChild(tt); meta.appendChild(row);
    card.appendChild(th); card.appendChild(meta);
    card.addEventListener('click', function(){ openLB(it.i - 1); });
    grid.appendChild(card);
  });
  sec.appendChild(head); sec.appendChild(grid);
  main.appendChild(sec);
});

/* search */
var q = document.getElementById('q');
q.addEventListener('input', function(){
  var v = q.value.trim().toLowerCase();
  var any = false;
  var cards = document.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    var hit = !v || cards[i].getAttribute('data-k').indexOf(v) > -1;
    cards[i].style.display = hit ? '' : 'none';
    if(hit) any = true;
  }
  var secs = document.querySelectorAll('.sec');
  for(var j=0;j<secs.length;j++){
    var vis = secs[j].querySelectorAll('.card:not([style*="display: none"])').length;
    secs[j].style.display = vis ? '' : 'none';
  }
  document.getElementById('empty').style.display = any ? 'none' : 'block';
});

/* lightbox */
var lb = document.getElementById('lb');
var lbimg = document.getElementById('lbimg');
var lbcap = document.getElementById('lbcap');
var cnt = document.getElementById('cnt');
var cur = -1;
function openLB(i){
  cur = i; lb.classList.add('on'); render();
}
function render(){
  var it = ITEMS[cur];
  lbimg.src = it.img;
  lbimg.alt = it.en;
  lbcap.innerHTML = '';
  var t = document.createElement('div'); t.textContent = it.en;
  var k = document.createElement('div'); k.className='k';
  k.textContent = 'SPU ' + it.s + ' ｜ ' + it.c;
  lbcap.appendChild(t); lbcap.appendChild(k);
  cnt.textContent = '#' + it.i + ' / ' + ITEMS.length;
}
function step(d){
  cur = (cur + d + ITEMS.length) % ITEMS.length; render();
}
document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); step(1); });
document.getElementById('lbclose').addEventListener('click', function(){ lb.classList.remove('on'); });
lb.addEventListener('click', function(e){ if(e.target === lb) lb.classList.remove('on'); });
document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape') lb.classList.remove('on');
  else if(e.key === 'ArrowLeft') step(-1);
  else if(e.key === 'ArrowRight') step(1);
});
</script>
</body>
</html>
